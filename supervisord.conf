[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F --fpm-config /etc/php/8.3/fpm/php-fpm.conf
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/usr/bin/php /var/www/bagisto/artisan queue:work --sleep=3 --tries=3 --timeout=60
directory=/var/www/bagisto
user=www-data
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/bagisto/queue.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/bagisto/queue-error.log
stderr_logfile_maxbytes=10MB

[program:scheduler]
command=/bin/bash -c "while true; do /usr/bin/php /var/www/bagisto/artisan schedule:run --no-interaction >> /var/log/bagisto/scheduler.log 2>&1; sleep 60; done"
directory=/var/www/bagisto
user=www-data
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null
